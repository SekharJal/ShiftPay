name: Build ShiftPay APK

# Runs on every push to main (and can be started by hand from the Actions tab).
# It builds an installable APK and publishes it on the repository's Releases page.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Keep the APK as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: ShiftPay-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ShiftPay.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ShiftPay.apk \
            --title "ShiftPay - latest test build" \
            --notes "Built from commit ${GITHUB_SHA::7}. Download ShiftPay.apk on your Android phone and install it." \
            --prerelease \
            --target "$GITHUB_SHA"

      # Runs after the APK is already published, so a failing test never blocks a download.
      - name: Run calculation-engine unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
